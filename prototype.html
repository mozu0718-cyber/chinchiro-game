<title>丼チンチロ 試作</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
  /* 一画面のゲーム。暗い賭場の卓という単一の見た目で固定する */
  :root {
    color-scheme: dark;
    --font-display: "Dela Gothic One", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    --bg: #120d0a;
    --ink: #f6eedd;
    --muted: #b9a88d;
    --panel: rgba(20, 14, 10, 0.78);
    --accent: #e0a63a;
    --line: rgba(246, 238, 221, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; }
  #hud { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); flex-wrap: wrap; display: flex; justify-content: space-between; gap: 12px; pointer-events: none; }
  #hint { background: var(--panel); border: 1px solid var(--line); padding: 8px 12px; border-radius: 8px; font-size: 14px; }
  #hint:empty { display: none; }
  #log { margin: 0; min-width: 0; padding: 8px 12px 8px 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; line-height: 1.6; }
  #log:empty { display: none; }
  #controls { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
  #controls[hidden] { display: none; }
  button { font: inherit; font-size: 16px; padding: 12px 18px; border-radius: 10px; border: 1px solid var(--accent); background: #3b2614; color: var(--ink); cursor: pointer; }
  button:hover { background: #4d3219; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { #banner.show, .fx-awful.show { animation-duration: 0.01s; animation-delay: 0s; opacity: 1; } }
  label { font-size: 13px; color: var(--muted); background: var(--panel); padding: 8px 10px; border-radius: 8px; display: flex; gap: 6px; align-items: center; }

  #banner { position: fixed; left: 0; right: 0; top: 14%; text-align: center; pointer-events: none; opacity: 0; }
  #banner .main { font-family: var(--font-display); font-size: clamp(44px, 12vw, 104px); font-weight: 400; letter-spacing: 0.06em; }
  #banner .sub { font-size: clamp(18px, 4vw, 28px); font-weight: 700; margin-top: 4px; }
  #banner.show { animation: pop 2.4s ease-out forwards; }
  @keyframes pop {
    0% { opacity: 0; transform: scale(2.2); }
    10% { opacity: 1; transform: scale(0.95); }
    16% { transform: scale(1.05); }
    22% { transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: scale(1); }
  }
  .fx-great .main { color: #ffd54a; text-shadow: 0 0 24px #ff7a00, 0 0 4px #fff, 0 4px 0 #8a2b00; }
  .fx-great .sub { color: #fff3c4; }
  .fx-good .main { color: #ffb347; text-shadow: 0 0 16px #ff6a00, 0 3px 0 #6a2a00; }
  .fx-normal .main { color: var(--ink); text-shadow: 0 3px 0 #000; }
  .fx-miss { top: 18% !important; }
  .fx-miss .main { font-size: clamp(28px, 7vw, 54px); color: var(--muted); }
  .fx-miss .sub { color: var(--muted); }
  .fx-bad .main { color: #9fb3c8; text-shadow: 0 3px 0 #000; }
  .fx-awful .main { color: #6f8fb0; text-shadow: 0 3px 0 #000; }
  .fx-awful.show { animation: sink 2.6s ease-in forwards; }
  @keyframes sink {
    0% { opacity: 0; transform: translateY(-40px) rotate(-4deg); }
    12% { opacity: 1; transform: translateY(0) rotate(-4deg); }
    75% { opacity: 1; transform: translateY(10px) rotate(-6deg); }
    100% { opacity: 0; transform: translateY(60px) rotate(-8deg); }
  }
</style>
<div id="stage"></div>
<div id="hud">
  <div id="hint"></div>
  <ol id="log"></ol>
</div>
<div id="banner"></div>
<div id="controls">
  <button id="btn-player">自分で振る</button>
  <button id="btn-cpu">CPUに振らせる</button>
  <label for="cpu-spread">CPUのブレ <input id="cpu-spread" type="range" min="0.5" max="4" step="0.5" value="1.5"></label>
</div>
<script src="dist/prototype.js"></script>
